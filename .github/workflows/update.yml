name: Auto-update data from game
on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scrape game data
        run: node scripts/scrape.mjs
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Không có cập nhật mới."
          else
            git commit -m "chore(data): game update $(date -u '+%F %H:%M') — hash $(node -p "require('./scripts/catalog.json').catalog_hash.slice(0,8)")"
            git push
            echo "Đã push → workflow Deploy sẽ tự chạy."
          fi
