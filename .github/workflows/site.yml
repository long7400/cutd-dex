name: Sync & Deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bỏ qua cache, tải + kiểm tra lại toàn bộ'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - id: sync
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          find .git -maxdepth 2 \( -name config -o -path '.git/hooks*' -o -name info \) -exec ls -la {} + | sha256sum > "$RUNNER_TEMP/git.sum"
          STOP="$(openssl rand -hex 16)"
          echo "::stop-commands::${STOP}"
          node scripts/sync.mjs ${FORCE:+"$FORCE"}
          echo "::${STOP}::"
      - name: Commit nếu có thay đổi
        env:
          HASH: ${{ steps.sync.outputs.hash }}
          GH_TOKEN: ${{ github.token }}
        run: |
          G="git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c credential.helper="
          find .git -maxdepth 2 \( -name config -o -path '.git/hooks*' -o -name info \) -exec ls -la {} + | sha256sum | cmp -s - "$RUNNER_TEMP/git.sum" || { echo "::error::.git bị đổi trong lúc sync — dừng"; exit 1; }
          test -z "$($G status --porcelain -- . ':!data' ':!public')" || { echo "::error::sync ghi ra ngoài data/ public/ — dừng"; exit 1; }
          $G add -A data public
          if $G diff --cached --quiet; then echo "Không có gì mới."; exit 0; fi
          case "$HASH" in *[!0-9a-f]*|'') HASH=unknown ;; esac
          $G -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --no-verify -m "chore(data): game update $(date -u '+%F %H:%M') — ${HASH}"
          $G push --no-verify "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

  canary:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Kiểm tra client game còn khớp CUTD Helper
        run: |
          STOP="$(openssl rand -hex 16)"
          echo "::stop-commands::${STOP}"
          node scripts/check-clients.mjs
          echo "::${STOP}::"

  build:
    needs: sync
    if: always() && needs.sync.result != 'failure' && (github.event_name == 'push' || needs.sync.outputs.changed == 'true' || inputs.force)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
