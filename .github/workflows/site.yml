name: Sync & Deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bỏ qua cache, tải + kiểm tra lại toàn bộ'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.pack.outputs.changed }}
      hash: ${{ steps.sync.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - id: sync
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          STOP="$(openssl rand -hex 16)"
          echo "::stop-commands::${STOP}"
          node scripts/sync.mjs ${FORCE:+"$FORCE"}
          echo "::${STOP}::"
      - id: pack
        run: |
          if [ -z "$(git status --porcelain -- data public/portraits public/research public/skills)" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/out/public"
          cp -R data "$RUNNER_TEMP/out/data"
          cp -R public/portraits public/research public/skills "$RUNNER_TEMP/out/public/"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.pack.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synced
          path: ${{ runner.temp }}/out
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: synced
          path: ${{ runner.temp }}/in
      - name: Kiểm file đồng bộ rồi commit (không chạy code của repo)
        env:
          HASH: ${{ needs.sync.outputs.hash }}
        run: |
          set -euo pipefail
          IN="$RUNNER_TEMP/in"
          fail() { echo "::error::$1"; exit 1; }
          stray="$(cd "$IN" && find . -mindepth 1 -regextype posix-extended \( -type l -o \( -type f ! -regex '\./data/(catalog|client|changelog|state|art-state)\.json' ! -regex '\./public/(portraits|research|skills)/[A-Za-z0-9_-]{1,80}\.webp' \) -o \( -type d ! -regex '\./(public/portraits|public/research|public/skills|public|data)' \) \) -print | head -3)"
          [ -z "$stray" ] || fail "artifact có file/thư mục lạ: $stray"
          [ -z "$(find "$IN/data" -type f -size +16M)" ] || fail "file dữ liệu quá lớn"
          for f in "$IN"/data/*.json; do jq -e 'type == "object" or type == "array"' "$f" > /dev/null || fail "JSON hỏng: $f"; done
          for f in "$IN"/public/*/*.webp; do
            [ "$(head -c 4 "$f")" = RIFF ] && [ "$(dd if="$f" bs=1 skip=8 count=4 2> /dev/null)" = WEBP ] || fail "không phải webp: $f"
            [ "$(stat -c %s "$f")" -le 2097152 ] || fail "ảnh quá lớn: $f"
          done
          for d in portraits research skills; do
            total="$(find "public/$d" -type f | wc -l)"
            gone="$(rsync -a --delete --dry-run --itemize-changes "$IN/public/$d/" "public/$d/" | grep -c '^\*deleting' || true)"
            [ "$gone" -le 5 ] || [ "$((gone * 4))" -le "$total" ] || fail "$d: xoá $gone/$total ảnh — quá nhiều"
            rsync -a --delete "$IN/public/$d/" "public/$d/"
          done
          cp "$IN"/data/*.json data/
          git add -A data public/portraits public/research public/skills
          if git diff --cached --quiet; then echo "Không có gì mới."; exit 0; fi
          case "$HASH" in *[!0-9a-f]*|'') HASH=unknown ;; esac
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --no-verify -m "chore(data): game update $(date -u '+%F %H:%M') — ${HASH}"
          git push --no-verify origin HEAD:main

  canary:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Kiểm tra client game còn khớp CUTD Helper
        run: |
          STOP="$(openssl rand -hex 16)"
          echo "::stop-commands::${STOP}"
          node scripts/check-clients.mjs
          echo "::${STOP}::"

  build:
    needs: [sync, publish]
    if: always() && needs.sync.result != 'failure' && needs.publish.result != 'failure' && (github.event_name == 'push' || needs.sync.outputs.changed == 'true' || inputs.force)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: CUTD_COMMIT="$(git rev-parse HEAD)" npm run build
      - run: npm test
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
